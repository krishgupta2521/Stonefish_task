# Build the Docker image on every push to main and publish it to the GitHub
# Container Registry, so anyone can run:
#   docker pull ghcr.io/krishgupta2521/stonefish_task:latest   (CUDA PyTorch)
#   docker pull ghcr.io/krishgupta2521/stonefish_task:cpu      (CPU-only, smaller)
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: cuda
            tag: latest
          - torch: cpu
            tag: cpu
    steps:
      - name: Free disk space (the CUDA image is about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH=${{ matrix.torch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stonefish_task:${{ matrix.tag }}
